# EXPERIMENTAL e NAO TESTADO: coleta redundante na nuvem, independente do seu PC e da VM.
# Limitacoes conhecidas: o agendamento do GitHub Actions atrasa (as vezes 10-30 min) e pode pular
# execucoes; o runner precisa alcancar a porta 41120 da APAC (nao verificado). Use como COMPLEMENTO.
# Os dados vao para o branch "coleta" (nao polui o main). Faca merge com experimento/mesclar_logs.py.
name: coletar
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coleta
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libcjson-dev libmosquitto-dev cmake
      - name: Build
        run: cmake -S . -B build && cmake --build build --target device_recife
      - name: Recuperar dados anteriores
        run: |
          git fetch origin coleta || true
          if git rev-parse --verify origin/coleta >/dev/null 2>&1; then
            git checkout origin/coleta -- coleta_dados/ 2>/dev/null && cp -r coleta_dados/* data/ || true
          fi
      - name: Coletar uma leitura
        working-directory: build
        run: ./device_recife --once
      - name: Publicar dados
        run: |
          mkdir -p coleta_dados/raw
          cp data/leituras_log.csv coleta_dados/ || true
          cp data/raw/*.json coleta_dados/raw/ 2>/dev/null || true
          git config user.name "coletor"; git config user.email "coletor@users.noreply.github.com"
          git checkout --orphan coleta_tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f coleta_dados
          git commit -m "coleta $(date -u +%FT%TZ)"
          git push -f origin coleta_tmp:coleta
