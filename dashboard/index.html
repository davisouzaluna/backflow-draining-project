<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensor Virtual Recife</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2125;--tx:#e8eaed;--mu:#9aa0a6;--bd:#2d3338}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.w{grid-column:1/-1}
h1{font-size:18px;margin:0}
h2{font-size:12px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.big{font-size:28px;font-weight:600}
.mu{color:var(--mu);font-size:13px}
#risco{color:#fff;text-align:center;padding:20px 14px}
#risco .big{font-size:24px}
table{width:100%;border-collapse:collapse}
td,th{padding:5px 4px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}
.ACIMA{color:#d33;font-weight:600}.ABAIXO{color:#2a9d4a}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#3b82f6}
canvas{width:100%;height:140px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#999;margin-right:6px}
</style>
</head>
<body>
<main>
  <div class="c w" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <h1>Sensor Virtual- Recife</h1>
    <span class="mu"><span class="dot" id="dot"></span><span id="st">conectando…</span> · <span id="ts">—</span></span>
  </div>
  <div class="c w" id="risco" style="background:#6b7280"><div class="mu" style="color:#fff">Risco de backflow</div><div class="big" id="rn">—</div></div>
  <div class="c"><h2>Chuva (média das estações)</h2><div class="big" id="cm">—</div><div class="mu" id="cd"></div></div>
  <div class="c"><h2>Maré (tábua)</h2><div class="big" id="mh">—</div><div class="mu" id="md"></div><div class="bar"><i id="mb" style="width:0"></i></div></div>
  <div class="c"><h2>Drenagem</h2><div class="big" id="dt">—</div><div class="mu" id="dd"></div></div>
  <div class="c w"><h2>Metas</h2>
    <table><thead><tr><th>Critério</th><th>Valor</th><th>Meta</th><th>Situação</th></tr></thead><tbody id="mt"></tbody></table></div>
  <div class="c w"><h2>Histórico (chuva em mm, maré em posição 0–1)</h2><canvas id="cv"></canvas></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
const BROKER = "ws://localhost:9001";
const T_LEITURA = "backflow/recife/leitura";
const T_STATUS = "backflow/recife/status";
const MAX = 120;
const COR = ["#6b7280", "#2a9d4a", "#e0a800", "#d33"];
const NOMES = {chuva_atencao:"Chuva — atenção (mm)", chuva_critica:"Chuva — crítica (mm)", mare_intermediaria:"Maré — intermediária (pos.)", mare_alta:"Maré — alta (pos.)"};
const hist = [];
const $ = id => document.getElementById(id);
const f = (v, n = 2) => Number(v).toFixed(n);

const cli = mqtt.connect(BROKER);
cli.on("connect", () => cli.subscribe([T_LEITURA, T_STATUS]));
cli.on("close", () => status(false, "broker desconectado"));
cli.on("message", (t, m) => {
  const s = m.toString();
  if (t === T_STATUS) return status(s === "online", s === "online" ? "sensor online" : "sensor offline");
  try { render(JSON.parse(s)); } catch (e) { console.error(e); }
});

function status(ok, txt) {
  $("dot").style.background = ok ? "#2a9d4a" : "#d33";
  $("st").textContent = txt;
}

function render(d) {
  $("ts").textContent = d.timestamp;
  $("risco").style.background = COR[d.risco.codigo];
  $("rn").textContent = d.risco.nome;

  $("cm").textContent = d.chuva.disponivel ? f(d.chuva.media_mm) + " mm" : "sem dado";
  $("cd").textContent = `maior ${f(d.chuva.maior_mm)} mm · ${d.chuva.estacoes} estações · ${d.chuva.ultima_leitura || "—"}`;

  const m = d.mare;
  $("mh").textContent = m.disponivel ? f(m.altura_m) + " m" : "sem dado";
  $("md").textContent = m.disponivel ? `${m.evento_data} ${m.evento_hora} · dia ${f(m.min_dia_m)}–${f(m.max_dia_m)} m` : "";
  $("mb").style.width = m.disponivel && m.posicao >= 0 ? f(m.posicao * 100, 0) + "%" : "0";

  $("dt").textContent = d.drenagem.total + " elementos";
  $("dd").textContent = `BL ${d.drenagem.bocas_lobo} · PV ${d.drenagem.pocos_visita} · CG ${d.drenagem.caixas_gaveta}`;

  $("mt").innerHTML = Object.keys(d.metas).map(k => {
    const a = d.metas[k];
    return `<tr><td>${NOMES[k] || k}</td><td>${f(a.valor)}</td><td>${f(a.meta)}</td><td class="${a.resultado}">${a.resultado}</td></tr>`;
  }).join("");

  hist.push({ c: d.chuva.media_mm, p: m.posicao >= 0 ? m.posicao : null });
  if (hist.length > MAX) hist.shift();
  grafico();
}

function grafico() {
  const cv = $("cv"), r = devicePixelRatio || 1;
  const w = cv.width = cv.clientWidth * r, h = cv.height = cv.clientHeight * r;
  const x = cv.getContext("2d");
  const cmax = Math.max(5, ...hist.map(p => p.c));
  const linha = (key, cor, esc) => {
    x.beginPath(); x.strokeStyle = cor; x.lineWidth = 2 * r;
    let ini = false;
    hist.forEach((p, i) => {
      if (p[key] == null) return;
      const px = hist.length > 1 ? i / (hist.length - 1) * w : w / 2;
      const py = h - (p[key] / esc) * (h - 8 * r) - 4 * r;
      ini ? x.lineTo(px, py) : x.moveTo(px, py); ini = true;
    });
    x.stroke();
  };
  x.clearRect(0, 0, w, h);
  linha("c", "#3b82f6", cmax);
  linha("p", "#e0a800", 1);
}
</script>
</body>
</html>
